[project]
name = "bila-kde-stochastic-interpolator"
version = "0.1.0"
description = "Endpoint-conditioned bidirectional KDE interpolation for univariate time series"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "scipy>=1.14", "pandas>=2.2", "arviz>=0.22,<1", "psutil>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilakde"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
examples = [
    "matplotlib>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
